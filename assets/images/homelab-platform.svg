<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1180" viewBox="0 0 960 1180" role="img" aria-labelledby="title description">
  <title id="title">Vereinfachte Architektur des BeyondCloudOps Homelabs</title>
  <desc id="description">Segmentiertes Heimnetz fuehrt zu zwei Proxmox-Hosts. Darauf laufen ein Kubernetes-Cluster und ein unabhaengiger Ubuntu-LXC fuer Prometheus und Grafana. Lokale KI ist als Ausbau markiert.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#718078" />
    </marker>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #19231e; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
      .title { font-family: Georgia, "Times New Roman", serif; font-size: 39px; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: .6px; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 19px; fill: #4c5a51; }
      .small { font-size: 15px; fill: #59665e; }
      .white { fill: #ffffff; }
      .muted-white { fill: #d6ded7; }
      .lime { fill: #d7ed68; }
    </style>
  </defs>
  <rect width="960" height="1180" fill="#f2f4ed" />
  <rect x="48" y="46" width="16" height="16" rx="3" fill="#d7ed68" />
  <text x="80" y="60" class="eyebrow">PRIVATE INFRASTRUKTUR / VEREINFACHT</text>
  <text x="48" y="126" class="title">Vom Heimnetz bis zum Dienst</text>

  <rect x="48" y="170" width="864" height="152" rx="8" fill="#ffffff" stroke="#d5dbd2" stroke-width="2" />
  <rect x="48" y="170" width="9" height="152" rx="4" fill="#9ab5ff" />
  <text x="80" y="207" class="label" fill="#315dc8">01 / NETZWERK &amp; ZUGANG</text>
  <text x="80" y="249" class="heading">MikroTik RB5009</text>
  <text x="80" y="286" class="body">VLAN-Segmentierung · WireGuard · UniFi WLAN</text>

  <line x1="480" y1="322" x2="480" y2="370" stroke="#718078" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="48" y="382" width="864" height="480" rx="8" fill="#ffffff" stroke="#bfc9bf" stroke-width="2" />
  <rect x="48" y="382" width="864" height="9" rx="4" fill="#d7ed68" />
  <text x="80" y="431" class="label" fill="#687d24">02 / VIRTUALISIERUNG · 2 THINKCENTRE-HOSTS</text>
  <text x="80" y="469" class="heading">Proxmox VE</text>

  <rect x="72" y="500" width="496" height="330" rx="6" fill="#19231e" />
  <text x="100" y="540" class="label lime">KUBERNETES / VMs</text>
  <text x="100" y="582" class="heading white">kubeadm-Cluster</text>
  <text x="100" y="618" class="body muted-white">Argo CD · Helm · GitOps</text>
  <line x1="100" y1="642" x2="540" y2="642" stroke="#405047" stroke-width="1" />
  <text x="100" y="680" class="label lime">PLATTFORM-DIENSTE</text>
  <text x="100" y="718" class="body white">MetalLB · Istio · cert-manager</text>
  <text x="100" y="768" class="small muted-white">Anwendungen werden aus Git verwaltet</text>

  <rect x="592" y="500" width="296" height="330" rx="6" fill="#e5ebfa" stroke="#9ab5ff" stroke-width="2" />
  <text x="618" y="540" class="label" fill="#315dc8">SEPARATER UBUNTU-LXC</text>
  <text x="618" y="590" class="heading">Monitoring</text>
  <text x="618" y="638" class="body">Prometheus</text>
  <text x="618" y="674" class="body">Grafana</text>
  <line x1="618" y1="700" x2="862" y2="700" stroke="#c5d2f3" stroke-width="1" />
  <text x="618" y="738" class="small">Außerhalb des Clusters</text>
  <text x="618" y="770" class="small">Cluster-Metriken zentral sichtbar</text>

  <rect x="48" y="900" width="864" height="198" rx="8" fill="#1b2923" />
  <rect x="48" y="900" width="9" height="198" rx="4" fill="#e2a584" />
  <text x="80" y="940" class="label lime">03 / LOKALE KI · IM AUSBAU</text>
  <text x="80" y="986" class="heading white">Separates Experimentierfeld</text>
  <text x="80" y="1026" class="body muted-white">Open WebUI · Ollama · LM Studio · SearXNG</text>
  <text x="80" y="1064" class="small muted-white">GPU-Inferenz mit Vulkan wird erprobt</text>

  <text x="48" y="1140" class="small">Schematisch. Netzwerkdetails und Zugriffsregeln sind bewusst weggelassen.</text>
</svg>